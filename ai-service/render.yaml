services:
  - type: web
    name: aapdasetu-damage-api
    runtime: python
    rootDir: ai-service
    plan: free
    region: frankfurt
    branch: divyanshu
    buildCommand: |
      python -m venv .venv
      .venv/bin/pip install --upgrade pip
      .venv/bin/pip install -r requirements-torch-cpu.txt --index-url https://download.pytorch.org/whl/cpu
      .venv/bin/pip install -r requirements-deploy.txt
    startCommand: .venv/bin/python bootstrap.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DAMAGE_MODEL_PATH
        value: checkpoints/best.pt
