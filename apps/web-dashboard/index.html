<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AapdaSetu | Multi-Agency Incident Command System (ICS)</title>
  <meta name="description" content="AapdaSetu real-time disaster command center with live P2P SOS tracking, AI triage, shelter capacity, disease surveillance, and volunteer dispatch.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0f1e;
      --card-bg: #111827;
      --card-bg-hover: #1a2237;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --red: #ef4444;
      --yellow: #f59e0b;
      --green: #10b981;
      --blue: #3b82f6;
      --purple: #a855f7;
      --border: #1e293b;
      --glass: rgba(17,24,39,0.85);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 0.6rem 1.2rem; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .brand { display: flex; align-items: center; gap: 0.6rem; font-size: 1.1rem; font-weight: 700; }
    .brand-icon { width: 28px; height: 28px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .status-bar { display: flex; gap: 1rem; align-items: center; font-size: 0.75rem; color: var(--text-sub); }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1.5s infinite; display: inline-block; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Stats Bar */
    .stats-bar { display: flex; gap: 0; background: var(--card-bg); border-bottom: 1px solid var(--border); }
    .stat-card { flex: 1; padding: 0.6rem 1rem; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .stat-card:last-child { border-right: none; }
    .stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-sub); margin-bottom: 0.2rem; }
    .stat-value { font-size: 1.3rem; font-weight: 700; }
    .stat-value.red { color: var(--red); }
    .stat-value.yellow { color: var(--yellow); }
    .stat-value.green { color: var(--green); }
    .stat-value.blue { color: var(--blue); }
    .stat-value.purple { color: var(--purple); }

    /* Main Layout */
    .main-layout { display: flex; flex: 1; overflow: hidden; }
    #map { flex: 1; z-index: 1; }

    /* Right Panel */
    .right-panel { width: 400px; background: var(--card-bg); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .tab-bar { display: flex; background: var(--bg-dark); border-bottom: 1px solid var(--border); }
    .tab { flex: 1; padding: 0.55rem; text-align: center; font-size: 0.7rem; font-weight: 600; cursor: pointer; color: var(--text-sub); border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); background: var(--card-bg); }
    .tab:hover { color: var(--text-main); }
    .tab-content { flex: 1; overflow-y: auto; padding: 0.8rem; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* SOS Cards */
    .sos-card { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; margin-bottom: 0.7rem; transition: all 0.2s; cursor: pointer; }
    .sos-card:hover { background: var(--card-bg-hover); border-color: #334155; transform: translateY(-1px); }
    .sos-card.RED { border-left: 3px solid var(--red); }
    .sos-card.YELLOW { border-left: 3px solid var(--yellow); }
    .sos-card.GREEN { border-left: 3px solid var(--green); }
    .sos-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .sos-name { font-weight: 600; font-size: 0.85rem; }
    .pill { padding: 0.15rem 0.45rem; border-radius: 10px; font-size: 0.65rem; font-weight: 700; }
    .pill.RED { background: rgba(239,68,68,0.15); color: var(--red); }
    .pill.YELLOW { background: rgba(245,158,11,0.15); color: var(--yellow); }
    .pill.GREEN { background: rgba(16,185,129,0.15); color: var(--green); }
    .sos-meta { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 0.3rem; }
    .sos-transcript { font-size: 0.78rem; font-style: italic; color: #cbd5e1; background: rgba(255,255,255,0.03); padding: 0.4rem; border-radius: 4px; margin: 0.4rem 0; }
    .btn { width: 100%; padding: 0.45rem; border: none; border-radius: 6px; font-weight: 600; font-size: 0.75rem; cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif; }
    .btn-dispatch { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; }
    .btn-dispatch:hover { background: linear-gradient(135deg, #1d4ed8, #1e40af); }

    /* Shelter Cards */
    .shelter-card { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; margin-bottom: 0.7rem; }
    .shelter-name { font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem; }
    .capacity-bar-wrap { background: #1e293b; border-radius: 4px; height: 8px; overflow: hidden; margin: 0.3rem 0; }
    .capacity-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
    .capacity-label { font-size: 0.72rem; color: var(--text-sub); display: flex; justify-content: space-between; }

    /* Volunteer Cards */
    .vol-card { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
    .vol-name { font-weight: 600; font-size: 0.82rem; }
    .vol-role { font-size: 0.72rem; color: var(--text-sub); }
    .vol-status { font-size: 0.68rem; font-weight: 600; padding: 0.15rem 0.4rem; border-radius: 10px; }
    .vol-status.available { background: rgba(16,185,129,0.15); color: var(--green); }
    .vol-status.dispatched { background: rgba(239,68,68,0.15); color: var(--red); }

    /* Ledger */
    .ledger-block { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem; margin-bottom: 0.5rem; font-size: 0.78rem; }
    .ledger-hash { font-family: monospace; font-size: 0.68rem; color: var(--purple); word-break: break-all; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">&#x1F6E1;</div>
    AapdaSetu ICS Command Center
  </div>
  <div class="status-bar">
    <span><span class="live-dot"></span> Live P2P Mesh Sync</span>
    <span id="wsStatus">WS: Connecting...</span>
    <span id="clock"></span>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-card"><span class="stat-label">Critical (Red)</span><span class="stat-value red" id="countRed">0</span></div>
  <div class="stat-card"><span class="stat-label">High (Yellow)</span><span class="stat-value yellow" id="countYellow">0</span></div>
  <div class="stat-card"><span class="stat-label">Normal (Green)</span><span class="stat-value green" id="countGreen">0</span></div>
  <div class="stat-card"><span class="stat-label">Volunteers Active</span><span class="stat-value blue" id="countVol">3</span></div>
  <div class="stat-card"><span class="stat-label">Shelter Occupancy</span><span class="stat-value purple" id="countShelter">72%</span></div>
</div>

<div class="main-layout">
  <div id="map"></div>
  <div class="right-panel">
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab('sos')">SOS Queue</div>
      <div class="tab" onclick="switchTab('shelters')">Shelters</div>
      <div class="tab" onclick="switchTab('volunteers')">Volunteers</div>
      <div class="tab" onclick="switchTab('ledger')">Aid Ledger</div>
    </div>
    <div class="tab-content">
      <div class="tab-panel active" id="panel-sos"></div>
      <div class="tab-panel" id="panel-shelters"></div>
      <div class="tab-panel" id="panel-volunteers"></div>
      <div class="tab-panel" id="panel-ledger"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Clock
  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);

  // Tab Switching
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('panel-' + name).classList.add('active');
  }

  // Map Init
  const map = L.map('map').setView([22.5726, 88.3639], 13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '&copy; CARTO' }).addTo(map);

  // Agency Sector Geofences (Feature 13: ICS)
  L.polygon([[22.565,88.355],[22.565,88.370],[22.575,88.370],[22.575,88.355]], { color: '#3b82f6', fillOpacity: 0.08, dashArray: '6 4' }).addTo(map).bindPopup('<b>NDRF Sector A</b><br>Lead: Commander Singh');
  L.polygon([[22.575,88.360],[22.575,88.380],[22.585,88.380],[22.585,88.360]], { color: '#f59e0b', fillOpacity: 0.08, dashArray: '6 4' }).addTo(map).bindPopup('<b>NGO Sector B</b><br>Lead: Red Cross Unit 7');

  // Flood Hazard Polygon Overlay (Feature 16: Satellite AI Flood Mapping)
  L.polygon([[22.570,88.360],[22.570,88.370],[22.580,88.370],[22.580,88.360]], { color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.15, dashArray: '4 2' }).addTo(map).bindPopup('<b>AI Detected Flood Zone</b><br>Sentinel-1 SAR<br>Depth: ~1.8m');

  // State
  const sosRecords = [];
  const markers = [];

  const volunteers = [
    { id: "VOL_101", name: "Dr. Ananya Roy", role: "Doctor", lat: 22.5740, lng: 88.3650, status: "Available" },
    { id: "VOL_102", name: "Vijay Singh", role: "Swimmer", lat: 22.5710, lng: 88.3620, status: "Available" },
    { id: "VOL_103", name: "Priya Das", role: "Translator", lat: 22.5750, lng: 88.3680, status: "Available" }
  ];

  const shelters = [
    { id: "SHELTER_SOL01", name: "Salt Lake Central Shelter", capacity: 500, occupancy: 346 },
    { id: "SHELTER_SOL02", name: "New Town Community Stadium", capacity: 1200, occupancy: 890 }
  ];

  const ledgerBlocks = [
    { index: 1, event: "GENESIS_BLOCK", hash: "7f2033ba545e27d1" },
    { index: 2, event: "DONATION: PM Relief Fund - Rs 5,00,000 -> Shelter Sector V", hash: "90fe34ab6d25d74a" },
    { index: 3, event: "DISTRIBUTION: 200x Warm Blankets -> SHELTER_SOL01 (QR Verified)", hash: "2067054cf784f133" }
  ];

  // Simulated SOS Incidents
  const mockIncidents = [
    {
      sos_uuid: "e208b187-026f-4859-b005-99775fd12f3e",
      victim_info: { name: "Rajesh Sharma", age: 62, medical_conditions: ["Diabetic", "Heart"], group_size: 3 },
      location: { latitude: 22.5726, longitude: 88.3639, landmark: "Karunamoyee, Salt Lake" },
      transcript: "3 log chhat par fanse hain, paani 5 feet bhar gaya hai, turant naav bhejo",
      triage: { priority_score: 95, urgency_level: "RED" },
      is_mesh_relayed: true, status: "DISPATCH_PENDING"
    },
    {
      sos_uuid: "a1b2c3d4-1111-2222-3333-abcdef123456",
      victim_info: { name: "Fatima Begum", age: 28, medical_conditions: ["Pregnant"], group_size: 2 },
      location: { latitude: 22.5780, longitude: 88.3680, landmark: "Sector V Metro Station" },
      transcript: "I am pregnant and trapped in my apartment, no food for 2 days, bleeding",
      triage: { priority_score: 98, urgency_level: "RED" },
      is_mesh_relayed: false, status: "DISPATCH_PENDING"
    },
    {
      sos_uuid: "b8812a91-4412-4123-aa99-1234567890ab",
      victim_info: { name: "Sunita Roy", age: 34, medical_conditions: [], group_size: 1 },
      location: { latitude: 22.5800, longitude: 88.3700, landmark: "Newtown Action Area 1" },
      transcript: "Need dry clothes and food packets",
      triage: { priority_score: 25, urgency_level: "GREEN" },
      is_mesh_relayed: false, status: "DISPATCH_PENDING"
    },
    {
      sos_uuid: "c9923b02-5523-5234-bb00-feedbeef5678",
      victim_info: { name: "Arun Ghosh", age: 45, medical_conditions: [], group_size: 5 },
      location: { latitude: 22.5690, longitude: 88.3580, landmark: "Ultadanga Bridge" },
      transcript: "5 construction workers stuck under a collapsed wall near the bridge",
      triage: { priority_score: 72, urgency_level: "YELLOW" },
      is_mesh_relayed: true, status: "DISPATCH_PENDING"
    }
  ];

  function getColor(level) { return level === 'RED' ? '#ef4444' : level === 'YELLOW' ? '#f59e0b' : '#10b981'; }

  function renderSOS(incidents) {
    const panel = document.getElementById('panel-sos');
    panel.innerHTML = '';
    // Sort by priority desc
    incidents.sort((a,b) => b.triage.priority_score - a.triage.priority_score);

    // Update stats
    document.getElementById('countRed').textContent = incidents.filter(i => i.triage.urgency_level === 'RED').length;
    document.getElementById('countYellow').textContent = incidents.filter(i => i.triage.urgency_level === 'YELLOW').length;
    document.getElementById('countGreen').textContent = incidents.filter(i => i.triage.urgency_level === 'GREEN').length;

    incidents.forEach(item => {
      const c = getColor(item.triage.urgency_level);
      const m = L.circleMarker([item.location.latitude, item.location.longitude], { color: c, fillColor: c, fillOpacity: 0.8, radius: item.triage.urgency_level === 'RED' ? 12 : 8 }).addTo(map);
      m.bindPopup(`<b>${item.victim_info.name} (Age: ${item.victim_info.age})</b><br>Score: ${item.triage.priority_score}/100<br>${item.location.landmark}<br><i>"${item.transcript}"</i>`);
      markers.push(m);

      const mesh = item.is_mesh_relayed ? '<span style="color:#a855f7;font-size:0.68rem;">&#x1F4E1; P2P Mesh Relayed</span>' : '';
      panel.innerHTML += `
        <div class="sos-card ${item.triage.urgency_level}">
          <div class="sos-header">
            <span class="sos-name">${item.victim_info.name} (x${item.victim_info.group_size || 1})</span>
            <span class="pill ${item.triage.urgency_level}">${item.triage.priority_score}/100</span>
          </div>
          <div class="sos-meta">&#x1F4CD; ${item.location.landmark} ${mesh}</div>
          <div class="sos-meta">&#x1FA7A; ${item.victim_info.medical_conditions.join(', ') || 'None'} | Age: ${item.victim_info.age}</div>
          <div class="sos-transcript">"${item.transcript}"</div>
          <button class="btn btn-dispatch" onclick="dispatchVolunteer('${item.sos_uuid}')">&#x1F6A8; Dispatch Skill-Matched Rescuer</button>
        </div>
      `;
    });
  }

  function renderShelters() {
    const panel = document.getElementById('panel-shelters');
    panel.innerHTML = '<h3 style="font-size:0.85rem;margin-bottom:0.6rem;">Live Shelter Capacity (Feature 7 & 13)</h3>';
    let totalOcc = 0, totalCap = 0;
    shelters.forEach(s => {
      totalOcc += s.occupancy; totalCap += s.capacity;
      const pct = Math.round(s.occupancy / s.capacity * 100);
      const barColor = pct > 85 ? 'var(--red)' : pct > 60 ? 'var(--yellow)' : 'var(--green)';
      panel.innerHTML += `
        <div class="shelter-card">
          <div class="shelter-name">&#x1F3E0; ${s.name}</div>
          <div class="capacity-bar-wrap"><div class="capacity-bar" style="width:${pct}%;background:${barColor}"></div></div>
          <div class="capacity-label"><span>${s.occupancy} / ${s.capacity} people</span><span>${pct}%</span></div>
        </div>
      `;
      // Shelter marker on map
      L.marker([s.id === 'SHELTER_SOL01' ? 22.573 : 22.581, s.id === 'SHELTER_SOL01' ? 88.364 : 88.372]).addTo(map)
        .bindPopup(`<b>${s.name}</b><br>${s.occupancy}/${s.capacity} (${pct}%)`);
    });
    document.getElementById('countShelter').textContent = Math.round(totalOcc / totalCap * 100) + '%';
  }

  function renderVolunteers() {
    const panel = document.getElementById('panel-volunteers');
    panel.innerHTML = '<h3 style="font-size:0.85rem;margin-bottom:0.6rem;">Registered Volunteers (Feature 10)</h3>';
    volunteers.forEach(v => {
      panel.innerHTML += `
        <div class="vol-card">
          <div><div class="vol-name">${v.name}</div><div class="vol-role">${v.role} | [${v.lat.toFixed(3)}, ${v.lng.toFixed(3)}]</div></div>
          <span class="vol-status ${v.status.toLowerCase()}">${v.status}</span>
        </div>
      `;
      // Volunteer marker
      L.circleMarker([v.lat, v.lng], { color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.6, radius: 6 }).addTo(map)
        .bindPopup(`<b>${v.name}</b><br>${v.role} | ${v.status}`);
    });
    document.getElementById('countVol').textContent = volunteers.filter(v => v.status === 'Available').length;
  }

  function renderLedger() {
    const panel = document.getElementById('panel-ledger');
    panel.innerHTML = '<h3 style="font-size:0.85rem;margin-bottom:0.6rem;">Cryptographic Aid Ledger (Feature 14)</h3>';
    ledgerBlocks.forEach(b => {
      panel.innerHTML += `
        <div class="ledger-block">
          <div style="font-weight:600;">Block #${b.index}</div>
          <div style="color:var(--text-sub);font-size:0.72rem;">${b.event}</div>
          <div class="ledger-hash">SHA-256: ${b.hash}...</div>
        </div>
      `;
    });
  }

  function dispatchVolunteer(uuid) {
    const avail = volunteers.find(v => v.status === 'Available');
    if (avail) {
      avail.status = 'Dispatched';
      renderVolunteers();
      alert(`Dispatched ${avail.name} (${avail.role}) to SOS ${uuid.substring(0,8)}...`);
    } else {
      alert('No available volunteers! All dispatched.');
    }
  }

  // WebSocket Connection (live data from API Gateway)
  function connectWS() {
    try {
      const ws = new WebSocket('ws://localhost:5000');
      ws.onopen = () => { document.getElementById('wsStatus').textContent = 'WS: Connected'; document.getElementById('wsStatus').style.color = '#10b981'; };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'NEW_SOS_ALERT') { mockIncidents.push(msg.payload); renderSOS(mockIncidents); }
        if (msg.type === 'EPIDEMIC_SURVEILLANCE_ALERT' && msg.payload.outbreak_alert_level === 'RED_ALERT_OUTBREAK_RISK') {
          alert(`EPIDEMIC RED ALERT at ${msg.payload.shelter_id}: ${msg.payload.total_symptomatic_cases} symptomatic cases detected!`);
        }
      };
      ws.onclose = () => { document.getElementById('wsStatus').textContent = 'WS: Offline (Mock Mode)'; document.getElementById('wsStatus').style.color = '#f59e0b'; };
      ws.onerror = () => { document.getElementById('wsStatus').textContent = 'WS: Offline (Mock Mode)'; document.getElementById('wsStatus').style.color = '#f59e0b'; };
    } catch(e) {
      document.getElementById('wsStatus').textContent = 'WS: Offline (Mock Mode)';
      document.getElementById('wsStatus').style.color = '#f59e0b';
    }
  }

  // Init
  renderSOS(mockIncidents);
  renderShelters();
  renderVolunteers();
  renderLedger();
  connectWS();
</script>
</body>
</html>
