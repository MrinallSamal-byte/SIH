name: CI - Build & Test Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Build & Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-aapdasetu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-aapdasetu/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and Build
        run: npm run build

  backend:
    name: Backend (Build, Typecheck & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-aapdasetu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-aapdasetu/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Architecture exclusions check
        run: npm run check:exclusions

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

  ai-service:
    name: AI Service & FastAPI Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-aapdasetu/fastapi-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-aapdasetu/fastapi-service/requirements.txt

      - name: Validate Python syntax
        run: python -m compileall apps/ai-engine backend-aapdasetu/fastapi-service

      - name: Verify FastAPI application loading
        run: |
          python -c "import sys; sys.path.insert(0, 'backend-aapdasetu/fastapi-service'); from app.main import app; print('FastAPI app initialized:', app.title)"

  android:
    name: Android Companion App (Unit Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitchat-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
