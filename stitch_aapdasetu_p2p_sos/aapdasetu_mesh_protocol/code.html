                                </div>

                        <div className="flex items-center justify-between border border-outline-variant p-4 glass-panel">

                                    </div>
                                    <input className="w-full bg-transparent border-b border-outline focus:border-primary focus:ring-0 text-headline-md font-headline-md py-4 transition-all uppercase placeholder:opacity-30" placeholder="ENTER DETAILS" type="text" required />
                                </div>

                            <div className="h-16 w-full dot-matrix opacity-20 my-4"></div>

                            <button className={`group relative flex flex-col items-center justify-center py-8 rounded-lg transition-transform active:scale-95 overflow-hidden ${btnStyle}`} type="submit">

                                <span className="font-label-caps text-label-caps opacity-70 relative z-10 uppercase mt-1">TRANSMIT OVER MESH PROTOCOL</span>

                            <div className="absolute inset-0 flex items-center justify-center">
                                <div className="w-8 h-8 rounded-full border border-primary animate-ping"></div>
                                <div className="w-2 h-2 bg-primary rounded-full absolute"></div>
                            </div>
                        </div>
                    </main>
                    <BottomNavBar />
                </div>
            );
        };

        // --- Screen 4: Onboarding Welcome ---
        const WelcomePage = () => {
            const navigate = useNavigate();
            return (
                <div className="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">
                    <main className="relative z-10 flex-1 flex flex-col justify-between items-center px-margin-mobile py-margin-mobile md:px-margin-desktop md:py-margin-desktop text-center">

                            <div className="font-headline-lg-mobile text-headline-lg-mobile tracking-tighter text-primary uppercase">AAPDASETU</div>
                            <div className="flex items-center gap-2">

                            </div>
                        </header>

                        <section className="flex flex-col items-center max-w-2xl w-full">

                            <div className="w-full h-64 md:h-80 glass-panel rounded-xl mb-10 relative overflow-hidden flex items-center justify-center">

                                <svg className="w-full h-full max-w-md" viewBox="0 0 400 200">
                                    <g className="mesh-line text-outline opacity-40">
                                        <line stroke="currentColor" strokeWidth="1" x1="100" x2="200" y1="100" y2="50"></line>
                                        <line stroke="currentColor" strokeWidth="1" x1="100" x2="200" y1="100" y2="150"></line>

                                        <line stroke="currentColor" strokeWidth="1" x1="200" x2="200" y1="50" y2="150"></line>
                                    </g>
                                    <g transform="translate(100, 100)">
                                        <circle className="node-pulse" fill="white" r="4"></circle>
                                        <circle className="animate-ping" fill="none" opacity="0.3" r="12" stroke="white" strokeWidth="1"></circle>
                                    </g>
                                    <g transform="translate(200, 50)"><rect fill="#8e9192" height="6" width="6" x="-3" y="-3"></rect></g>
                                    <g transform="translate(200, 150)"><rect fill="#8e9192" height="6" width="6" x="-3" y="-3"></rect></g>
                                    <g transform="translate(300, 100)"><rect fill="#8e9192" height="6" width="6" x="-3" y="-3"></rect></g>
                                </svg>
                                <div className="absolute bottom-4 left-4 flex gap-4">
                                    <div className="flex items-center gap-1">
                                        <span className="font-label-caps text-[10px] opacity-40">PROTO:</span>
                                        <span className="font-label-caps text-[10px]">MESH_V4</span>
                                    </div>
                                    <div className="flex items-center gap-1">
                                        <span className="font-label-caps text-[10px] opacity-40">STATUS:</span>
                                        <span className="font-label-caps text-[10px] text-secondary">ACTIVE</span>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-6">
                                <h2 className="font-headline-md text-headline-md text-primary uppercase">The Mesh Protocol</h2>
                                <p className="font-body-lg text-on-surface-variant max-w-lg leading-relaxed">
                                    Your phone becomes a beacon. Even without cellular service, you can signal for help through the community mesh.
                                </p>
                            </div>
                        </section>

                        <footer className="w-full max-w-lg mt-12 mb-8">
                            <button 
                                className="w-full py-5 bg-primary text-on-primary font-label-caps text-lg transition-all duration-200 active:scale-95 flex items-center justify-center gap-3 hover:bg-opacity-90"
                                onClick={() => navigate('/setup')}
                            >
                                GET STARTED
                                <span className="material-symbols-outlined">arrow_forward</span>
                            </button>
                            <p className="mt-4 font-data-mono text-[10px] uppercase opacity-30 text-center tracking-widest">
                                System Build v4.0.2-Rel • Encryption Enabled
                            </p>
                        </footer>
                    </main>
                </div>
            );
        };

        // --- Router App ---
        const App = () => {
            return (
                <MemoryRouter initialEntries={['/']}>
                    <Routes>
                        <Route path="/" element={<WelcomePage />} />
                        <Route path="/setup" element={<CalibrationPage />} />
                        <Route path="/mesh" element={<MeshPage />} />
                        <Route path="/map" element={<MapEntryPage />} />
                        {/* Fallbacks for generic routes */}
                        <Route path="/alerts" element={<MeshPage />} />
                        <Route path="/profile" element={<WelcomePage />} />
                    </Routes>
                </MemoryRouter>

        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
